services:
  app:
    build:
      context: .
      dockerfile: Dockerfile
    environment:
      PYTHONUNBUFFERED: "1"
      PAPER_TRADING: "true"
      LIVE_TRADING: "false"
      BROKER_ENV: "demo"
      BROKER_PROVIDER: "oanda"
      BROKER_ENDPOINT: "https://api-fxpractice.oanda.com"
      DAILY_DRAWDOWN_LIMIT: "0.02"
      DATA_DIR: /app/data
      LOG_DIR: /app/logs
    volumes:
      - ./src:/app/src
      - ./tests:/app/tests
      - bot_data:/app/data
      - bot_logs:/app/logs
    depends_on:
      postgres:
        condition: service_healthy
    restart: unless-stopped
    command: ["python", "-m", "trading_bot"]

  test:
    build:
      context: .
      dockerfile: Dockerfile
    environment:
      PYTHONUNBUFFERED: "1"
      PAPER_TRADING: "true"
      LIVE_TRADING: "false"
      BROKER_ENV: "demo"
      BROKER_PROVIDER: "oanda"
      BROKER_ENDPOINT: "https://api-fxpractice.oanda.com"
      DAILY_DRAWDOWN_LIMIT: "0.02"
      DATA_DIR: /tmp/trading-bot-data
      LOG_DIR: /tmp/trading-bot-logs
    profiles:
      - test
    command: ["pytest", "-q"]

  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: ${POSTGRES_DB:?POSTGRES_DB must be set in .env}
      POSTGRES_USER: ${POSTGRES_USER:?POSTGRES_USER must be set in .env}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?POSTGRES_PASSWORD must be set in .env}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $$POSTGRES_USER -d $$POSTGRES_DB"]
      interval: 10s
      timeout: 5s
      retries: 5
    restart: unless-stopped

volumes:
  bot_data:
  bot_logs:
  postgres_data:
