services:
  app:
    build:
      context: .
      dockerfile: Dockerfile
    env_file:
      - .env
    environment:
      PYTHONUNBUFFERED: "1"
      PAPER_TRADING: "true"
      LIVE_TRADING: "false"
      TRADING_MODE: "BROKER_DEMO"
      BROKER_ENV: "demo"
      BROKER_PROVIDER: "${BROKER_PROVIDER:-exness_mt5}"
      BROKER_ACCOUNT: "${BROKER_ACCOUNT:-}"
      BROKER_ACCOUNT_ID: "${BROKER_ACCOUNT_ID:-}"
      BROKER_SERVER: "${BROKER_SERVER:-}"
      BROKER_TOKEN: "${BROKER_TOKEN:-}"
      DEFAULT_SYMBOL: EURUSDm
      INSTRUMENT: EURUSDm
      FORWARD_TEST_ENABLED: "true"
      MAX_SPREAD_TOLERANCE: "0.00035"
      MAX_SPREAD: "0.00035"
      RISK_STOP_DISTANCE: "0.0010"
      NEWS_EVENTS_PATH: /app/data/news_events.json
      NEWS_FEED_URL: https://nfs.faireconomy.media/ff_calendar_thisweek.json
      EXNESS_BRIDGE_HOST: host.docker.internal
      EXNESS_BRIDGE_PORT: "${EXNESS_BRIDGE_PORT:-18812}"
      BROKER_ENDPOINT: "https://host.docker.internal:${EXNESS_BRIDGE_PORT:-18812}"
      EXNESS_SERVER: "${EXNESS_SERVER:-}"
      EXNESS_LOGIN: "${EXNESS_LOGIN:-}"
      EXNESS_PASSWORD: "${EXNESS_PASSWORD:-}"
      DAILY_DRAWDOWN_LIMIT: "${DAILY_DRAWDOWN_LIMIT:-0.01}"
      DATA_DIR: /app/data
      LOG_DIR: /app/logs
    extra_hosts:
      - "host.docker.internal:host-gateway"
    volumes:
      - ./src:/app/src
      - ./tests:/app/tests
      - bot_data:/app/data
      - ./data/news_events.json:/app/data/news_events.json:ro
      - bot_logs:/app/logs
    depends_on:
      postgres:
        condition: service_healthy
    stop_grace_period: 15s
    healthcheck:
      test: ["CMD", "python", "-m", "config.health"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 10s
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"
    restart: unless-stopped
    command: ["python", "-m", "trading_bot"]

  test:
    build:
      context: .
      dockerfile: Dockerfile
    environment:
      PYTHONUNBUFFERED: "1"
      PAPER_TRADING: "${PAPER_TRADING:-true}"
      LIVE_TRADING: "${LIVE_TRADING:-false}"
      INSTRUMENT: "${INSTRUMENT:-XAUUSDm}"
      DAILY_DRAWDOWN_LIMIT: "${DAILY_DRAWDOWN_LIMIT:-0.01}"
      LOG_DIR: /tmp/trading-bot-logs
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"
    profiles:
      - test
    command: ["pytest", "-q"]

  dashboard:
    build:
      context: .
      dockerfile: Dockerfile
    environment:
      DASHBOARD_DATABASE_PATH: /app/data/session_metrics.db
      TRADING_MODE: "BROKER_DEMO"
      PAPER_TRADING: "true"
      LIVE_TRADING: "false"
      DEFAULT_SYMBOL: EURUSDm
      INSTRUMENT: EURUSDm
      MAX_SPREAD_TOLERANCE: "0.00035"
      MAX_SPREAD: "0.00035"
      EXNESS_BRIDGE_HOST: host.docker.internal
      EXNESS_BRIDGE_PORT: "${EXNESS_BRIDGE_PORT:-18812}"
      OLLAMA_BASE_URL: http://host.docker.internal:11434
      OLLAMA_MODEL: "${OLLAMA_MODEL:-llama3.1}"
      NEWS_EVENTS_PATH: /app/data/news_events.json
      NEWS_MAX_AGE_SECONDS: "${NEWS_MAX_AGE_SECONDS:-3600}"
      NEWS_FEED_URL: https://nfs.faireconomy.media/ff_calendar_thisweek.json
      MAX_DATA_AGE_SECONDS: "${MAX_DATA_AGE_SECONDS:-300}"
      ACCOUNT_EQUITY: "${ACCOUNT_EQUITY:-10000}"
      DAILY_DRAWDOWN_LIMIT: "${DAILY_DRAWDOWN_LIMIT:-0.01}"
      STREAMLIT_SERVER_HEADLESS: "true"
      STREAMLIT_SERVER_ADDRESS: 127.0.0.1
      STREAMLIT_SERVER_PORT: "8501"
    ports:
      - "127.0.0.1:8501:8501"
    volumes:
      - bot_data:/app/data
      - ./data/news_events.json:/app/data/news_events.json:ro
    command:
      [
        "streamlit",
        "run",
        "src/trading_bot/ui/app.py",
        "--server.address=0.0.0.0",
        "--server.port=8501",
      ]
    depends_on:
      - app
    restart: unless-stopped

  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: ${POSTGRES_DB:?POSTGRES_DB must be set in .env}
      POSTGRES_USER: ${POSTGRES_USER:?POSTGRES_USER must be set in .env}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?POSTGRES_PASSWORD must be set in .env}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $$POSTGRES_USER -d $$POSTGRES_DB"]
      interval: 10s
      timeout: 5s
      retries: 5
    restart: unless-stopped
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"

volumes:
  bot_data:
  bot_logs:
  postgres_data: